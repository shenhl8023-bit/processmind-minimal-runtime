name: processmind

services:
  api:
    image: ${PROCESSMIND_API_IMAGE:-registry.cn-hangzhou.aliyuncs.com/public-topeak/processmind-api:20260327}
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        INCLUDE_ROLLER_PROFILE_ASSETS: ${INCLUDE_ROLLER_PROFILE_ASSETS:-0}
    container_name: processmind-api
    restart: unless-stopped
    environment:
      PROCESSMIND_DATA_DIR: /runtime-data
      # The current API supports only SQLite through the async aiosqlite driver.
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////runtime-data/db/process_mind.db}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      KNOWLEDGE_SEARCH_PROVIDER: ${KNOWLEDGE_SEARCH_PROVIDER:-}
      KNOWLEDGE_SEARCH_API_URL: ${KNOWLEDGE_SEARCH_API_URL:-}
      KNOWLEDGE_SEARCH_API_KEY: ${KNOWLEDGE_SEARCH_API_KEY:-}
      PROCESSMIND_KMAI_MAX_COMBINATIONS: ${PROCESSMIND_KMAI_MAX_COMBINATIONS:-10000}
      PROCESSMIND_KMAI_MAX_CONDITION_OBJECTS: ${PROCESSMIND_KMAI_MAX_CONDITION_OBJECTS:-100000}
    volumes:
      - ./data:/runtime-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    image: ${PROCESSMIND_WEB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/public-topeak/processmind-web:20260327}
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: processmind-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # This desktop-style deployment has no account system. Keep it local by
      # default; an intranet deployment must deliberately add an authenticated
      # gateway and its own port binding.
      - "127.0.0.1:${PROCESSMIND_WEB_PORT:-8080}:80"
